name: Build and publish website

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      refresh_publications:
        description: Refresh public ORCID and DOI metadata before building
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh publications
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_publications))
        env:
          ORCID_READ_TOKEN: ${{ secrets.ORCID_READ_TOKEN }}
        run: python scripts/publications.py sync
      - name: Record refreshed bibliography
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_publications))
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git diff --quiet -- _data/publications_imported.json _data/publications.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add _data/publications_imported.json _data/publications.json
            git commit -m 'Refresh public publication metadata'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Prepare bibliography and publication pages
        run: python scripts/publications.py build
      - name: Check bibliography behaviour
        run: python -m unittest discover -s tests -v
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace
      - name: Check internal links and assets
        run: python scripts/check_site.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
