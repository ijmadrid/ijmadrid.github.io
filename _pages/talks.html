{% assign talks = site.talks | sort: 'date' | reverse %}
{% for talk in talks %}<article class="teaching-entry"><p class="eyebrow">{{ talk.date | date: '%d %B %Y' }}</p><h2><a href="{{ talk.url | relative_url }}">{{ talk.title | escape }}</a></h2><p>{{ talk.venue | escape }}</p><p>{{ talk.location | escape }}</p></article>{% endfor %}
